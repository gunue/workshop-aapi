apiVersion: v1
kind: LimitRange
metadata:
  name: checkout-limits
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  limits:
  - type: Container
    min:
      cpu: 10m
      memory: 16Mi
    max:
      cpu: 800m
      memory: 128Mi
    defaultRequest:
      cpu: 100m
      memory: 64Mi
    default:
      cpu: 800m
      memory: 128Mi

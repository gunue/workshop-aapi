apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workshop-checkout-b
  namespace: openshift-gitops
spec:
  project: workshop-aapi
  source:
    repoURL: https://github.com/gunue/workshop-aapi.git
    targetRevision: lab/ss76v
    path: deploy/overlays/ss76v/team-b
  destination:
    server: https://kubernetes.default.svc
    namespace: workshop-team-b
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - FailOnSharedResource=true
